<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gajjalavaripalli Quiz</title>
<style>
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#180000,#520808,#080808);font-family:Arial;color:#fff;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:100%;max-width:650px;background:#211313;border:2px solid #d5a642;border-radius:22px;padding:25px;text-align:center}
h1{color:#ffd65c}.hidden{display:none!important}
.lang{position:fixed;top:14px;right:14px;padding:9px 15px;border:0;border-radius:20px;background:#fff;color:#111;font-weight:bold}
.start{width:100%;padding:16px;border:0;border-radius:12px;background:#e53935;color:#fff;font-size:18px;font-weight:bold}
.question{font-size:21px;line-height:1.5;margin:22px 0}
.answer{display:block;width:100%;min-height:55px;margin:10px 0;padding:14px;border:2px solid #c29645;border-radius:12px;background:#3a2020;color:#fff;font-size:17px;text-align:left;cursor:pointer}
.answer.correct{background:#176b3b}.answer.wrong{background:#9a2020}
.status{min-height:30px;margin-top:14px;font-weight:bold}
.progress{height:8px;background:#4b3020;border-radius:10px;overflow:hidden;margin:15px 0}
.bar{height:100%;background:#e53935;width:0}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;margin-top:18px}
</style>
</head>
<body>
<button class="lang" id="langBtn" onclick="toggleLanguage()">తెలుగు</button>
<div class="card">
<div id="startScreen"><h1>🔒 VIDEO PUZZLE</h1><p id="intro">Answer all 3 questions correctly to reveal the video.</p><button class="start" id="startBtn" onclick="startQuiz()">START QUIZ</button></div>
<div id="quizScreen" class="hidden"><div id="counter"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div id="answers"></div><div class="status" id="status"></div></div>
<div id="videoScreen" class="hidden"><h1>🎉 VIDEO UNLOCKED!</h1><p>All 3 answers are correct.</p><iframe src="https://www.youtube.com/embed/SCTSjUWsQGs?autoplay=1&rel=0" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
</div>
<script>
const questions=[
{english:"What is the village name registered in Government records?",telugu:"ప్రభుత్వ రికార్డుల్లో మన గ్రామం పేరుగా నమోదు చేయబడినది ఏది?",answers:[
{english:"Gajjalavaripalli",telugu:"గజ్జలవారిపల్లి",correct:true},
{english:"Yerakula Vaddi Palli",telugu:"యేరకుల వడ్డిపల్లి",correct:false},
{english:"Urlagaddapodhu",telugu:"ఉర్లగడ్డపొదు",correct:false},
{english:"Vaddipalli",telugu:"వడ్డిపల్లి",correct:false}]},
{english:"In the Vinayaka Swamy festival, which one did we NOT see?",telugu:"వినాయక స్వామి పండుగలో మనం ఏదిని చూడలేదు?",answers:[
{english:"Moon",telugu:"చంద్రుడు",correct:true},
{english:"Sun",telugu:"సూర్యుడు",correct:false},
{english:"Water",telugu:"నీరు",correct:false},
{english:"Earth",telugu:"భూమి",correct:false}]},
{english:"Our villagers are all...?",telugu:"మన గ్రామస్థులందరూ...?",answers:[
{english:"Family",telugu:"కుటుంబం",correct:true},
{english:"Friends",telugu:"స్నేహితులు",correct:false},
{english:"Cousins",telugu:"కజిన్స్ / బంధువులు",correct:false},
{english:"Well known persons",telugu:"బాగా తెలిసిన వ్యక్తులు",correct:false}]}
];
let current=0,language="english";
function toggleLanguage(){
language=language==="english"?"telugu":"english";
document.getElementById("langBtn").textContent=language==="english"?"తెలుగు":"English";
document.getElementById("intro").textContent=language==="english"?"Answer all 3 questions correctly to reveal the video.":"వీడియోను చూడటానికి 3 ప్రశ్నలకు సరైన సమాధానాలు ఇవ్వండి.";
document.getElementById("startBtn").textContent=language==="english"?"START QUIZ":"క్విజ్ ప్రారంభించండి";
if(!document.getElementById("quizScreen").classList.contains("hidden"))showQuestion();
}
function startQuiz(){current=0;document.getElementById("startScreen").classList.add("hidden");document.getElementById("quizScreen").classList.remove("hidden");showQuestion();}
function showQuestion(){
const q=questions[current];
document.getElementById("counter").textContent=language==="english"?"Question "+(current+1)+" of 3":"ప్రశ్న "+(current+1)+" / 3";
document.getElementById("bar").style.width=((current+1)/3*100)+"%";
document.getElementById("question").textContent=language==="english"?q.english:q.telugu;
document.getElementById("status").textContent="";
const box=document.getElementById("answers");box.innerHTML="";
q.answers.forEach(function(answer,index){
const button=document.createElement("button");
button.type="button";button.className="answer";
button.textContent=String.fromCharCode(65+index)+". "+(language==="english"?answer.english:answer.telugu);
button.onclick=function(){checkAnswer(answer,button)};
box.appendChild(button);
});
}
function checkAnswer(answer,button){
if(answer.correct===true){
button.classList.add("correct");
document.getElementById("status").textContent=language==="english"?"✓ Correct answer!":"✓ సరైన సమాధానం!";
document.querySelectorAll(".answer").forEach(function(b){b.disabled=true});
setTimeout(function(){current++;if(current<questions.length)showQuestion();else revealVideo()},700);
}else{
button.classList.add("wrong");
document.getElementById("status").textContent=language==="english"?"✗ Wrong answer — try again.":"✗ తప్పు సమాధానం — మళ్లీ ప్రయత్నించండి.";
setTimeout(function(){button.classList.remove("wrong")},700);
}
}
function revealVideo(){document.getElementById("quizScreen").classList.add("hidden");document.getElementById("videoScreen").classList.remove("hidden");}
</script>
</body>
</html>
